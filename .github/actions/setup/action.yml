name: Setup
description: Install bun at the version mise.toml pins, install the workspace, and build its packages.

inputs:
  build:
    description: Run the root build script, when the workspace has one.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - name: Read the bun version from mise.toml
      id: bun
      shell: bash
      run: |
        version="$(sed -n 's/^bun = "\(.*\)"$/\1/p' mise.toml)"
        echo "version=${version:-latest}" >> "$GITHUB_OUTPUT"

    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: ${{ steps.bun.outputs.version }}

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: bun-${{ runner.os }}-

    - name: Install
      shell: bash
      run: bun install --frozen-lockfile

    - name: Build packages
      if: inputs.build == 'true'
      shell: bash
      run: |
        if jq -e '.scripts.build' package.json > /dev/null; then
          bun run build
        fi
