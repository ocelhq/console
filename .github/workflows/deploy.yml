name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Ref to deploy instead of main."
        default: ""
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: production
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ vars.CONSOLE_DOMAIN }}
    timeout-minutes: 45
    env:
      OCEL_CONFIG: ocel.aws.config.ts
      OCEL_TELEMETRY: "0"
      AWS_REGION: ${{ vars.CONSOLE_AWS_REGION }}
      CONSOLE_DOMAIN: ${{ vars.CONSOLE_DOMAIN }}
      VARIABLES_KMS_KEY: ${{ vars.CONSOLE_VARIABLES_KMS_KEY }}
      NEON_DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      # A deploy without these drops the custom domain, reseals variables under another key, or
      # migrates nothing; refuse it instead.
      - name: Require the production settings
        run: |
          set -euo pipefail
          missing=()
          for name in AWS_REGION CONSOLE_DOMAIN VARIABLES_KMS_KEY NEON_DATABASE_URL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::the production environment does not set: ${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Install the CLI the SDK pins
        run: |
          set -euo pipefail
          version="$(jq -r '.workspaces.catalog.ocel' package.json)"
          curl -fsSL https://ocel.dev/install.sh | OCEL_VERSION="$version" sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ vars.CONSOLE_AWS_REGION }}
          role-session-name: console-deploy-${{ github.run_id }}

      - name: Guard the account
        env:
          EXPECTED: ${{ vars.AWS_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          account="$(aws sts get-caller-identity --query Account --output text)"
          [ -n "$EXPECTED" ] || { echo "::error::AWS_ACCOUNT_ID is not set"; exit 1; }
          [ "$account" = "$EXPECTED" ] || { echo "::error::session is account $account, not $EXPECTED"; exit 1; }

      - name: Deploy
        run: ocel deploy --json --tag "sha-$(git rev-parse --short=7 HEAD)"

      - name: Keep what the deploy reported
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-report
          path: .ocel/deploy-report.json
          if-no-files-found: warn
