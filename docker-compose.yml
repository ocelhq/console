name: ocel-console

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    configs:
      - source: test-database
        target: /docker-entrypoint-initdb.d/10-test-database.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

configs:
  test-database:
    content: |
      CREATE DATABASE ocelhq_test;

volumes:
  postgres:
